<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 308" width="760" height="308" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cluster-light-title cluster-light-desc" id="cluster-light-root">
  <title id="cluster-light-title">Cluster</title>
  <desc id="cluster-light-desc">node-2 and node-3 join node-1. The three nodes share one PostgreSQL database, and node-1 is the leader.</desc>
