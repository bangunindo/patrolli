<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 148" width="760" height="148" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="single-node-without-backend-dark-title single-node-without-backend-dark-desc" id="single-node-without-backend-dark-root">
  <title id="single-node-without-backend-dark-title">Single node without a backend</title>
  <desc id="single-node-without-backend-dark-desc">Devices send data to one Patrolli node, which reads its configuration from config.yaml and delivers the data to its destinations.</desc>
  <defs>
    <marker id="single-node-without-backend-dark-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
    <marker id="single-node-without-backend-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
    <marker id="single-node-without-backend-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#2d3142"/>
  <rect x="176" y="24" width="408" height="100" rx="8" fill="#2d3142" stroke="rgba(191,192,192,0.25)" stroke-width="1"/>
  <text x="192" y="46" fill="#949eb2" font-size="9" letter-spacing="1" font-family="'Geist Mono', ui-monospace, monospace">PATROLLI</text>
  <path d="M 144,80 H 174" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#single-node-without-backend-dark-arrow-muted)"/>
  <path d="M 584,80 H 614" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#single-node-without-backend-dark-arrow-muted)"/>
  <rect x="16" y="52" width="128" height="56" rx="6" fill="#2d3142"/>
  <rect x="16" y="52" width="128" height="56" rx="6" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
  <text x="80" y="78" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Devices</text>
  <text x="80" y="94" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">syslog, SNMP, NetFlow</text>
  <rect x="616" y="52" width="128" height="56" rx="6" fill="#2d3142"/>
  <rect x="616" y="52" width="128" height="56" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
  <text x="680" y="78" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Destinations</text>
  <text x="680" y="94" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">file, Kafka, ClickHouse</text>
  <rect x="192" y="52" width="112" height="56" rx="6" fill="#2d3142"/>
  <rect x="192" y="52" width="112" height="56" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
  <text x="248" y="78" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">node-1</text>
  <text x="248" y="94" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reads config.yaml</text>
</svg>
