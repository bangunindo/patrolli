ssl:
    enabled: true
    cert: './dev/certs/ssl/frontend.crt'
    key: './dev/certs/ssl/frontend.key'
    ca: './dev/certs/ssl/ca.crt'
    reject_unauthorized: true

clusters:
    - name: 'patrolli'
      url: 'http://localhost:8080'
    - name: 'patrolli-1'
      url: 'http://localhost:30001'

auth:
    keycloak:
        host: 'https://kc.localtest.me:8443/realms/patrolli'
        client_id: 'patrolli-ssr'
        client_secret: '__E2E_OIDC_SECRET__'
        redirect_uri: '/auth/oidc/callback'
        ca_cert_path: './dev/certs/ssl/ca.crt'

cors:
    enabled: true
    origin:
        - 'https://localhost:3000'
        - 'https://kc.localtest.me:8443'
    credentials: true
    max_age: 86400
