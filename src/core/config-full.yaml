  # HTTP target, scraped by prometheus_scrape items.
  # - id: 019c65dc-3e74-70a2-875c-6035bf8990f9
  #   name: router-office-exporter
  #   host_id: 019bcb00-2fee-70a2-b151-3b1c2de7d947
  #   type: http
  #   config:
  #     url: https://192.168.1.1:9100/metrics    # http or https
  #     connect_timeout: 1000                    # ms, default 1000
  #     # Either {Basic: {username, password}} or {Bearer: <token>}.
  #     auth:
  #       Bearer: "exporter-token"
  #     # tls:
  #     #   insecure_skip_verify: false
  #     #   ca_cert_path: /etc/patrolli/exporter-ca.crt

# ──────────────────────────────────────────────────────────────────────────────
# processors — DAG of processors. `inputs` connects to upstream processor IDs
# (so chains compose); items also fan into processors via Item.processors.
# ──────────────────────────────────────────────────────────────────────────────
processors:
  # `attribute_lookup` enriches attributes from the lookup_tables above. The
  # block stays commented because it references those example table ids; it is
  # parsed and validated by a unit test, so it cannot drift.
  # BEGIN attribute_lookup example
  # - id: 019c98c8-5512-70a2-906e-7ccd03618710
  #   name: enrich
  #   type: attribute_lookup
  #   config:
  #     when:                  # optional shared guard; evaluated once for all rules
  #       match:               # map form, not the !match tag: see the note above
  #         table: resource    # valid for both resource and record destinations below
  #         key: deployment.environment
  #         key_is_regex: false
  #         op: "="
  #         value: {string: production}
  #     overwrite: false       # default: preserve existing keys, including nulls
  #     lookups:               # independent rules; all read the incoming attributes
  #       - lookup_table: 019b77b3-df79-70a2-ab01-f43b2cf72402 # host_owners
  #         table: resource    # destination and default input attribute table
  #         match:
  #           keys:            # lookup-table key column -> input attribute
  #             tenant: {key: tenant.id}
  #             hostname: {key: host.name}
  #         output:            # destination attribute -> lookup-table column
  #           owner.team: team
  #           owner.email: email
  #       - lookup_table: 019b77b3-df79-70a2-ab01-f43b2cf72400 # geoip_city
  #         table: record      # log/span/metric attributes, not data-point attrs
  #         when:              # optional rule guard; ANDed with the shared guard
  #           match:
  #             table: record
  #             key: network.transport
  #             key_is_regex: false
  #             op: "="
  #             value: {string: tcp}
  #         match:
  #           point:           # range probe; add keys above for partitioned ranges
  #             key: nf.data.sourceIPv4Address
  #             cast: ip       # explicit conversion; key casts: bool/integer/string/ip
  #                            # an `ip` key column or range point always needs
  #                            # `cast: ip` — OTAP has no IP value, so it arrives
  #                            # as a string; the rule is rejected without it
  #         output:            # destination attribute -> lookup-table column
  #           "geoip.source.country": country
  #           "geoip.source.city": city
  #           "geoip.source.latitude": latitude
  # END attribute_lookup example
  # Missing inputs, failed casts, misses and null result cells leave outputs alone.
  # Guards use the existing AttributeFilter syntax, but spelled as maps
  # (`match:` / `and:` / `or:`, `value: {string: x}`) rather than YAML tags:
  # everything under a processor's `config:` is buffered by the `type`/`config`
  # tagging on the processor config, and buffered content cannot replay a YAML tag. Omitted
  # or null means no extra restriction. They select whole records; unselected
  # records pass through unchanged. A guard error skips
  # enrichment for its block/rule and counts an error, without dropping telemetry.
  # Resource/scope destinations require BOTH guards to reference only that same
  # table, including inside AND/OR branches. Record destinations allow any table.
  # A record rule can read a resource input using {table: resource, key: host.id}.
  # Keys are matched byte for byte: a flattened array element is addressed by its
  # literal index (`nf.data.0.x`), and composite keys align by parent record.
  # Duplicate output keys within one attribute table are rejected. All writes are intended to merge once per
  # destination table; a rule cannot read another rule's output in this processor.

  # `attribute_collect` captures incoming attributes into mutable lookup tables.
  # Commented for the same reason as the block above — it references the example
  # table ids — and parsed by a unit test, so it cannot drift either.
  # BEGIN attribute_collect example
  # - id: 019c98c8-5512-70a2-906e-7ccd03618711
  #   name: collect_interfaces
  #   type: attribute_collect
  #   config:
  #     when:                  # optional shared guard; same map syntax as lookup
  #       match:
  #         table: resource
  #         key: deployment.environment
  #         key_is_regex: false
  #         op: "="
  #         value: {string: production}
  #     collections:
  #       - lookup_table: 019b77b3-df79-70a2-ab01-f43b2cf72403 # interfaces
  #         table: record      # source table and default input location
  #         when:              # optional rule guard, ANDed with the shared guard
  #           match:
  #             table: record
  #             key: snmp.id
  #             key_is_regex: false
  #             op: "=~"
  #             value: {string: "^[0-9]+$"}
  #         pivot:             # bind columns to array elements by a naming field
  #           array: snmp.data           # elements are snmp.data.<n>.<field>
  #           name: oid_name             # field naming the column, e.g. IF-MIB::ifDescr.33
  #           value: value_formatted     # field supplying the cell unless overridden
  #           name_format:               # optional; omitted uses the raw name
  #             type: snmp_object        # snmp_object | regex_extract
  #             strip_instance: true     # default; false keeps "ifDescr.33"
  #           # name_format: {type: regex_extract, pattern: '::(\w+)', group: 1}
  #         columns:           # lookup-table column -> binding
  #           ifIndex: {key: snmp.id, cast: integer}  # exact attribute key
  #           ifDescr:                                # null: pivoted, object "ifDescr"
  #           ifAlias: {cast: string}                 # pivoted; options without a key
  #           ifType: {value: value, cast: integer}   # pivoted from the raw value field
  #           admin_status: {name: ifAdminStatus}     # pivoted from a differently named object
  # END attribute_collect example
  # Only source.type: processor tables are writable. Their column types, keys,
  # range inclusivity, TTL and capacity stay on the lookup-table definition.
  # Bind every declared column, including keys and range bounds. Each parent
  # supplies one complete row; repeated keys replace the row and refresh its
  # TTL. No partial merging or processor-level overwrite option.
  # Keys are matched byte for byte (an array element is `a.0.b`; `*` has no
  # special meaning). Record rules may also read resource attributes with
  # {table: resource, key: host.id}. Guards select whole records, and both
  # guards on a resource/scope rule may reference only that same source table.
  # `pivot` names columns by an element field instead of by position, which the
  # SNMP walk does not keep stable: the element whose normalized name equals the
  # column name (or the binding's `name`) supplies the cell from `pivot.value` or
  # the binding's `value`. Duplicate names within a record resolve to the highest
  # element index. `snmp_object` drops `MODULE::` and, by default, the instance.
  # Missing inputs, null keys/bounds and failed casts skip the entire row.
  # Explicit null value cells are stored as null; capacity rejections are counted
  # separately. Telemetry passes through unchanged, even on collection errors.
  # Casts: bool/integer/string/ip, plus double for non-key value columns. An `ip`
  # column always needs `cast: ip`, bound or not, for the reason given above.

  # `null` is a no-op — useful purely for routing (fan-in / fan-out joins).
  - id: 019c98c8-5512-70a2-906e-7ccd03618700
    name: passthrough
    type: "null"

  # The attribute processors below address attributes by table:
  #   record    log / span / metric attributes
  #   scope     instrumentation-scope attributes
  #   resource  resource attributes

  # `add_attributes` sets constant attributes. Values are typed:
  # {type: bool | int | double | str, value: ...}.
  - id: 019c98c8-5512-70a2-906e-7ccd03618702
    name: add-site
    type: add_attributes
    config:
      overwrite: false           # required; false keeps a key that is already set
      kv_map:
        resource:
          site: {type: str, value: hq}
          rack: {type: int, value: 12}

  # `attribute_filter` keeps the records that match and drops the rest. One of
  # `match`, `and: [...]` or `or: [...]`, nested freely.
  #   op: = | != | =~ | !~ | < | <= | > | >=   (regex ops need a string value)
  #   value: {string: ..} | {integer: ..} | {float: ..}
  - id: 019c89fd-632a-70a2-b02b-c43fa9c96a3d
    name: only-mgmt-vlan
    type: attribute_filter
    config:
      match:
        table: record
        key: nf.data.ipNextHopIPv4Address
        key_is_regex: false      # true matches `key` as a regex over attribute keys
        op: "="
        value: {string: 10.0.0.1}

  # `rename_attributes` renames keys, old -> new, per table.
  - id: 019c89fd-632a-70a2-b02b-c43fa9c96a3e
    name: rename-host
    type: rename_attributes
    inputs:
      - 019c98c8-5512-70a2-906e-7ccd03618702  # chain after add-site
    config:
      rename_map:
        resource:
          host.name: device.name

  # `drop_attributes` removes keys, per table.
  - id: 019c89fd-632a-70a2-b02b-c43fa9c96a3f
    name: drop-noise
    type: drop_attributes
    inputs:
      - 019c89fd-632a-70a2-b02b-c43fa9c96a3e
    config:
      keys:
        record: [snmp.raw, nf.data.flowEndSysUpTime]

  # `transform` runs a program on otel-arrow's columnar query engine. `config`
  # holds one key naming its language; `opl` (OpenTelemetry Processing
  # Language) is the only one so far. Experimental: OPL is pre-1.0 upstream.
  # Guide:
  # https://github.com/open-telemetry/otel-arrow/tree/main/rust/otap-dataflow/crates/query-engine-languages/docs/opl-user-guide
  # A program starts with the signals it selects (logs | traces | metrics |
  # signals, or one metric type: gauges, sums, histograms, ...), then
  # `|`-separated operators: where, drop, set, rename, remove, apply (e.g.
  # `apply attributes {...}`, `apply data_points {...}`), if / else if / else.
  # Batches of other signals pass through unchanged. A syntax error fails
  # validation with its line and column; a batch the engine fails on (e.g. an
  # operation it cannot plan yet) is dropped and counted as errored. route_to
  # is rejected: route with processor inputs instead.
  - id: 019c89fd-632a-70a2-b02b-c43fa9c96a40
    name: tag-critical
    type: transform
    inputs:
      - 019c89fd-632a-70a2-b02b-c43fa9c96a3f
    config:
      opl: |
        logs
        | where severity_number >= 17 or contains(body, "error")
        | set attributes["tier"] = "critical"
        | remove attributes["internal.debug"]

# ──────────────────────────────────────────────────────────────────────────────
# items — what to collect. snmp / snmp_walk / prometheus_scrape / dummy are
# scheduled by the monitor pool; listener items pull from a listener.
#
#   schedule: integer seconds ("60"), cron ("0 */5 * * * *"), or "never".
#             Default 300s.
#   timeout:  milliseconds per check. Default 1000.
# ──────────────────────────────────────────────────────────────────────────────
items:
  # ── Listener item for the internal_metrics listener above: every report
  #    it sends goes to this item's processors.
  - type: listener
    id: 019b914b-7234-70a2-af38-89569b7c1b0f
    name: patrolli-self-metrics
    host_id: 019bcb00-2fee-70a2-b151-3b1c2de7d947
    listener_id: 019b77b3-df79-70a2-ab01-f43b2cf723a9
    processors:
      - 019c98c8-5512-70a2-906e-7ccd03618702
    config:
      match_strategy:
        method: none

  # ── Listener item: routes metrics from a listener to a host.
  - type: listener
    id: 019bd3f0-f429-70a2-8602-508e4a18f8b9
    name: netflow-from-router
    host_id: 019bcb00-2fee-70a2-b151-3b1c2de7d947
    listener_id: 019b77b3-df79-70a2-ab01-f43b2cf723a4
    processors:
      - 019c89fd-632a-70a2-b02b-c43fa9c96a3d
    config:
      # How an incoming packet is matched to this item. `none` is the
      # catch-all fallback. Variants:
      #   endpoint_source_ip — match against the endpoint's address (IP only)
      #   source_ips         — match against an explicit IP set:
      #                          config: [192.168.1.1, 192.168.1.2]
      #   attribute_match    — match an attribute filter, same syntax as the
      #                        attribute_filter processor:
      #                          config: {match: {table: record, key: ..., ...}}
      #   none               — accept all
      match_strategy:
        method: none

  # ── Listener item for internal logs: every record of the internal_logs
  #    listener above goes to this item's processors.
  - type: listener
    id: 019bd3f0-f429-70a2-8602-508e4a18f8c0
    name: patrolli-logs
    host_id: 019bcb00-2fee-70a2-b151-3b1c2de7d947
    listener_id: 019b77b3-df79-70a2-ab01-f43b2cf723a8
    processors:
      - 019c89fd-632a-70a2-b02b-c43fa9c96a3d
    config:
      match_strategy:
        method: none

  # ── SNMP single-OID get. Multiple SNMP items against the same endpoint
  #    are coalesced into one GET request.
  - type: snmp
    id: 019c65dc-6f10-70a2-ad19-b7c6eadeff90
    name: sysUpTime
    host_id: 019bcb00-2fee-70a2-b151-3b1c2de7d947
    endpoint_id: 019c65dc-3e74-70a2-875c-6035bf8990f6
    schedule: "60"
    timeout: 5000
    processors:
      - 019c98c8-5512-70a2-906e-7ccd03618702
    config:
      oid: sysUpTime.0          # symbolic (needs MIB) or numeric (1.3.6.1.2.1.1.3.0)
      # use_mib: true           # add oid_name and value_formatted from the MIB

  # ── SNMP walk. With table_format=true, nested OID chains are joined like
  #    a table (index-aligned).
  - type: snmp_walk
    id: 019c65dc-6f10-70a2-ad19-b7c6eadeff91
    name: interfaces-table
    host_id: 019bcb00-2fee-70a2-b151-3b1c2de7d947
    endpoint_id: 019c65dc-3e74-70a2-875c-6035bf8990f6
    schedule: "*/5 * * * * * *"
    timeout: 30000
    processors:
      - 019c98c8-5512-70a2-906e-7ccd03618702
    config:
      table_format: true
      # max_unknown_oids_per_row: 0  # discard a row when more than this many of the
                                     # oids below (chains included) return nothing for
                                     # it; omit to emit rows however incomplete
      use_mib: true
      # disable_bulk: false       # override endpoint setting; omit to inherit
      poll_worker_count: 2        # parallel GETBULK in flight; device-dependent
      max_results: 100000         # safety cap; aborts walk if exceeded
      chunk_size: 100
      request_timeout: 5000       # ms per request
      request_retries: 2
      oids:
        - oid: ifIndex
          chain:
            - oid: IP-MIB::ipIfStatsHCOutMcastOctets.2
              # How a chained oid is joined to its parent's rows. Only valid on
              # a nested chain, never on a root oid.
              #   value                 the parent's value is the index (default)
              #   oid_position          sub-identifiers start..end (inclusive)
              #                         of the parent's oid are the index
              #   oid_position_reversed the same, counted from the end
              # chain_strategy:
              #   strategy: oid_position
              #   config: {start: 10, end: 11}
        - oid: ifDescr
        - oid: ifName
        - oid: ifAlias
        - oid: ifType
        - oid: ifAdminStatus

  # ── Prometheus scrape of an http endpoint.
  # - type: prometheus_scrape
  #   id: 019c65dc-6f10-70a2-ad19-b7c6eadeff93
  #   name: node-exporter
  #   host_id: 019bcb00-2fee-70a2-b151-3b1c2de7d947
  #   endpoint_id: 019c65dc-3e74-70a2-875c-6035bf8990f9
  #   schedule: "30"
  #   processors:
  #     - 019c98c8-5512-70a2-906e-7ccd03618702
  #   config:
  #     stream: false             # hand each metric on as it is scraped, not one batch per scrape
  #     accept_protobuf: false    # ask for the protobuf exposition format

  # ── Dummy item: fixed synthetic log row, useful for plumbing tests.
  # - type: dummy
  #   id: 019c65dc-6f10-70a2-ad19-b7c6eadeff92
  #   name: dummy-item
  #   host_id: 019bcb00-2fee-70a2-b151-3b1c2de7d947
  #   schedule: "5"
  #   config:
  #     count: 1                  # rows per check, default 1
  #     payload:
  #       row:
  #         body: {String: hello}
  #         # Required, may be []. Each entry is [key, value]; keys are
  #         # {String: ..}, values one of {Bool: ..} | {Int64: ..} |
  #         # {Double: ..} | {String: {String: ..}} | {Array: [..]} |
  #         # {KvList: [[key, value], ..]} | Null
  #         attrs:
  #           - [{String: source}, {String: {String: synthetic}}]
  #           - [{String: seq}, {Int64: 1}]

# ──────────────────────────────────────────────────────────────────────────────
# sinks — terminal destinations. `inputs` is a list of processor IDs whose
# output flows into this sink.
#
# These sit next to `type`, on the sink itself, never under `config:`:
#   worker_count   default available_parallelism(); 0 means the same
#   batch_size     items per batch. Default 1000. Unlike a listener's, not
#                  capped at 65535: the sink only counts whole payloads
#   batch_timeout  ms; a partial batch is flushed after this long. Default 1000
#   channel        the queue in front of the sink, same shape as global.processor:
#                    {type: memory, non_blocking, channel_buffer_size}, or
#                    {type: disk, ...} to survive restarts. Default memory.
#                  A disk channel here also takes `write_through: true`
#                  (default false): every payload is written to disk before
#                  it is accepted and stays there until the sink is done with
#                  it (delivered, rejected, or out of `max_elapsed`), so a
#                  crash or kill loses nothing accepted. At-least-once: what
#                  was in flight is sent again after a restart. Costs a disk
#                  write per payload even when the sink keeps up. A kafka
#                  sink needs `required_acks: all` with it. Not allowed on
#                  global.processor or the forwarder, which nothing acks.
#   retry          how a batch the destination could not take is retried, by
#                  the worker holding it, on every sink type. With a disk
#                  channel, the backlog of a destination that is down waits
#                  on disk.
#                    initial_interval  ms before the first retry. Default 1000
#                    max_interval      ms; longest wait between retries. Default 60000
#                    multiplier        growth of the wait per retry, >= 1. Default 2
#                    max_elapsed       ms a batch is retried for before it is
#                                      dropped. 0 (default) retries forever
# ──────────────────────────────────────────────────────────────────────────────
sinks:
  # ── File sink. Use path: "null" to discard (handy for benchmarks).
  - type: file
    id: 019b6e6e-7e75-70a2-b0ba-d88cb64a9d4a
    name: file-1
    worker_count: 1
    batch_size: 1000
    batch_timeout: 1000
    channel:
      type: memory
      non_blocking: false
      channel_buffer_size: 0
    retry:
      initial_interval: 1000
      max_interval: 60000
      multiplier: 2.0
      max_elapsed: 0
    inputs:
      - 019c98c8-5512-70a2-906e-7ccd03618702
    config:
      # A file is appended to, a record at a time: a write that fails partway
      # (disk full) is cut off again, so the file only ever holds whole
      # records. `stdout`, `stderr` and `null` are also accepted.
      path: /var/log/patrolli/metrics.log
      # json_otlp_batch (default) | json_nested_batch | json_otlp_denormalized |
      # json_nested_denormalized | proto_otlp
      format: json_otlp_batch
      throttle: 0               # 0 = no throttle

  # ── Kafka sink.
  # - type: kafka
  #   id: 019b6e6e-7e75-70a2-b0ba-d88cb64a9d4b
  #   name: kafka-1
  #   # Each worker shards, serializes and produces one batch at a time, and
  #   # waits for Kafka to acknowledge all of it before it takes the next: this
  #   # is the sink's write concurrency.
  #   worker_count: 1
  #   batch_size: 1000
  #   batch_timeout: 3000       # ms
  #   # A batch Kafka could not take within write_timeout_seconds (brokers or
  #   # leaders unreachable) is retried; one it refused (unknown topic, message
  #   # too large, not authorized) is dropped.
  #   retry:
  #     initial_interval: 1000
  #     max_interval: 60000
  #     multiplier: 2.0
  #     max_elapsed: 0
  #   inputs:
  #     - 019c98c8-5512-70a2-906e-7ccd03618702
  #   config:
  #     hosts:
  #       - kafka-1.internal:9093
  #       - kafka-2.internal:9093
  #     topic: patrolli-metrics
  #     # Required, no default. Same values as the file sink.
  #     format: json_otlp_batch
  #     # librdkafka clients the workers share, one per batch round-robin. Each
  #     # has its own queue, broker threads and connections; worker_count, not
  #     # this, sets how many batches are in flight. Default 1.
  #     producer_count: 1
  #     # item_id (default) | host_id | listener_id — which field becomes the Kafka key.
  #     key_strategy: host_id
  #     allow_empty_key: false   # if false, metrics without a key are dropped
  #     # How long one attempt at a batch may take (message.timeout.ms); past
  #     # it the batch is retried per `retry`. Omitted or 0, 30.
  #     write_timeout_seconds: 30
  #     # fnv1a | murmur2 (default) | random | consistent | fnv1a_random |
  #     # murmur2_random | consistent_random
  #     balancer_strategy: murmur2
  #     # What "delivered" means: none (acks=0, written to the leader's
  #     # socket; broker errors go unseen) | one (default, the leader has it) |
  #     # all (every in-sync replica has it; the only durable choice).
  #     required_acks: one
  #     compression: lz4         # none (default) | gzip | snappy | lz4 | zstd
  #     # Per-partition batching inside each producer.
  #     partition_batch_size: 1000000    # bytes (batch.size), default 1000000
  #     partition_batch_count: 10000     # messages (batch.num.messages), default 10000
  #     # Bytes queued per producer (queue.buffering.max.kbytes), default 1048576000.
  #     global_queue_size: 1048576000
  #     # Largest message the producer will send, in bytes (message.max.bytes),
  #     # measured before compression; a bigger one is dropped without being
  #     # sent. The broker's own limit (max.message.bytes, ~1 MiB by default)
  #     # applies to the compressed batch, so raising this lets a compressible
  #     # message (e.g. a large json_*_batch payload) through for the broker to
  #     # judge. 1000..1000000000; omitted or 0, 1000000 (librdkafka's default).
  #     max_message_size: 1000000
  #     # librdkafka statistics every 5s, logged at debug.
  #     enable_producer_stats: false
  #     security:
  #       protocol: sasl_ssl     # plaintext | ssl | sasl_plaintext | sasl_ssl
  #     # Required with sasl_plaintext / sasl_ssl, rejected otherwise.
  #     sasl:
  #       mechanism: sha256      # plain | sha256 | sha512
  #       username: patrolli
  #       password: "kafka-secret"
  #     # Required with ssl / sasl_ssl, rejected otherwise.
  #     ssl:
  #       insecure_skip_verify: false
  #       ca_cert_path: /etc/patrolli/kafka-ca.crt
  #       # mTLS:
  #       # cert_path: /etc/patrolli/kafka-client.crt
  #       # key_path: /etc/patrolli/kafka-client.key
  #       # key_password: "optional"

  # ── OpenTelemetry sink: OTAP or OTLP over gRPC, to a collector or to an
  #    `open_telemetry` listener on another Patrolli node.
  # - type: open_telemetry
  #   id: 019b6e6e-7e75-70a2-b0ba-d88cb64a9d4c
  #   name: otel-forwarder
  #   worker_count: 2
  #   batch_size: 1000
  #   batch_timeout: 1000
  #   # A batch is acked once its destinations answered for it. One that no
  #   # destination is connected for, that got no answer (connection lost, 60s
  #   # without one), or that got a status OTLP calls retryable (UNAVAILABLE,
  #   # DEADLINE_EXCEEDED, ABORTED, CANCELLED, OUT_OF_RANGE, DATA_LOSS, and
  #   # RESOURCE_EXHAUSTED when the server sends RetryInfo, whose delay is then
  #   # waited out) is retried; any other non-ok status drops it. broadcast
  #   # retries only the destinations that failed. A worker has one batch in
  #   # flight, so worker_count is the sink's concurrency.
  #   retry:
  #     initial_interval: 1000
  #     max_interval: 60000
  #     multiplier: 2.0
  #     max_elapsed: 0
  #   inputs:
  #     - 019c98c8-5512-70a2-906e-7ccd03618702
  #   config:
  #     destinations:
  #       - 10.0.0.1:4317
  #       - 10.0.0.2:4317
  #     mode: otap                # otap (default) | otlp
  #     # broadcast   — send to every destination (default)
  #     # round_robin — rotate across destinations
  #     # failover    — stick to the first healthy destination
  #     # sharded     — hash by `key` and pin each shard to one destination.
  #     #               key: host_id | item_id | endpoint_id | listener_id | source_ip
  #     distribution:
  #       strategy: round_robin
  #       # key: host_id          # required when strategy: sharded
  #     connection_count: 1       # connections per destination, default 1
  #     compression: lz4          # none | lz4 | zstd (default zstd)
  #     write_timeout: 15000      # ms; gRPC keep-alive timeout. 0 (default) leaves it off
  #     # tls:
  #     #   insecure_skip_verify: false
  #     #   ca_cert_path: /etc/patrolli/otel-ca.crt

  # ── Clickhouse sink: inserts over the HTTP interface into tables laid out
  #    like the OpenTelemetry collector's Clickhouse exporter.
  # - type: clickhouse
  #   id: 019b6e6e-7e75-70a2-b0ba-d88cb64a9d4d
  #   name: clickhouse-1
  #   worker_count: 2
  #   batch_size: 10000
  #   batch_timeout: 5000
  #   # A network error, a timeout, an overloaded server (TOO_MANY_PARTS,
  #   # MEMORY_LIMIT_EXCEEDED, TIMEOUT_EXCEEDED, a read-only replica, ...) or a
  #   # proxy's 429/502/503/504 keeps the batch and retries it; a rejected
  #   # insert (missing table, bad column) drops it. Same shape on every sink.
  #   retry:
  #     initial_interval: 1000
  #     max_interval: 60000
  #     multiplier: 2.0
  #     max_elapsed: 0
  #   inputs:
  #     - 019c98c8-5512-70a2-906e-7ccd03618702
  #   config:
  #     # HTTP interface URLs (usually 8123 / 8443). More than one turns on
  #     # client-side routing; with a proxy or Distributed table in front, list
  #     # the single front door.
  #     endpoints:
  #       - http://ch-1:8123
  #     # round_robin (default) | random | failover. No broadcast: that would
  #     # duplicate rows, not replicate them.
  #     distribution:
  #       strategy: round_robin
  #     database: default         # default "default"
  #     username: patrolli           # optional; password requires it
  #     password: "clickhouse-secret"
  #     compression: lz4          # none | lz4 (default) | zstd
  #     # Server-side async inserts. Worth it unless batch_size is already a few
  #     # thousand rows per flush.
  #     async_insert: false
  #     wait_for_async_insert: false   # ignored unless async_insert
  #     enable_schema_validation: false
  #     write_timeout: 30000      # ms, default 30000; 0 disables it
  #     # Inserts in flight to each endpoint at once, across all workers (one
  #     # per table per batch). Lets worker_count go past the core count to
  #     # hide insert latency without piling queries onto the server: extra
  #     # workers wait with their batch ready, and the wait does not count
  #     # toward write_timeout. 0 (default) = no limit.
  #     max_concurrent_inserts: 8
  #     # Extra session settings sent with every statement.
  #     settings:
  #       max_execution_time: "60"
  #     # Omit to manage the schema yourself (recommended in production). When
  #     # present, CREATE DATABASE / TABLE IF NOT EXISTS runs at startup; these
  #     # knobs only apply at creation time.
  #     create_schema:
  #       cluster_name: my_cluster      # emits ON CLUSTER; omit otherwise
  #       table_engine:
  #         name: MergeTree             # default; e.g. ReplicatedMergeTree
  #         params: []
  #       ttl: 0                        # seconds, 0 (default) disables it
  #     # Destination table per signal; these are the defaults.
  #     tables:
  #       logs: otel_logs
  #       traces: otel_traces
  #       metrics_gauge: otel_metrics_gauge
  #       metrics_sum: otel_metrics_sum
  #       metrics_summary: otel_metrics_summary
  #       metrics_histogram: otel_metrics_histogram
  #       metrics_exp_histogram: otel_metrics_exp_histogram
  #     # tls:
  #     #   ca_cert_path: /etc/patrolli/clickhouse-ca.crt
