[package]
name = "patrolli-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
patrolli = { path = "../.." }
anyhow = "1.0.103"
async-recursion = "1.1.1"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
http = "1.4.2"
petgraph = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision", "raw_value"] }
smol_str = { version = "0.3.6", features = ["serde"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec", "time"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["serde", "v5", "v7"] }
axum = { version = "0.8.9", features = ["macros", "http2", "ws"] }
deadpool-postgres = "0.14.1"
sea-query = { version = "1.0.1", features = ["thread-safe"] }
sea-query-postgres = { version = "0.6.0", features = ["with-uuid", "with-chrono", "with-json", "postgres-array"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1", "with-time-0_3"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "compression-full", "decompression-full"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "debug-embed"] }
http-serde = "2.1.1"
axum-extra = { version = "0.12.6", features = ["query"] }
rand = "0.10.2"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
rsa = "0.9.10"
