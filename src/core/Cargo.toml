[workspace]
members = ["crates/api", "crates/app", "crates/cluster", "crates/processor", "crates/proto", "crates/sink"]
default-members = [".", "crates/api", "crates/app", "crates/cluster", "crates/processor", "crates/proto", "crates/sink"]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.lints.clippy]
# Only fires on #[async_trait]/#[async_recursion] output, and its fix deletes
# the attribute, which breaks the build.
double_must_use = "allow"

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
arrow = "59.3.2"
arrow-ipc = "59.3.2"
async-recursion = "1.2.0"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "http2", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
bytes = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
ciborium = "0.2.2"
clickhouse = { version = "0.15.3", features = [
    "chrono",
    "lz4",
    "zstd",
    "rustls-tls",
    "uuid",
] }
clickhouse-ext-arrow = "0.2.0"
const-hex = "1.19.3"
deadpool-postgres = "0.14.2"
fjall = { version = "3.1.13", default-features = false, features = ["bytes_1"] }
flate2 = "1.1.10"
flume = "0.12.0"
futures = "0.3.34"
futures-util = "0.3.34"
http = "1.5.0"
http-serde = "2.1.1"
ipnet = "2.12.2"
lz4_flex = "0.14.0"
otel-arrow-dfe-config = "0.64.0"
otel-arrow-dfe-pdata = "0.64.0"
otel-arrow-dfe-query-engine = "0.64.0"
papaya = "0.2.5"
parking_lot = { version = "0.12.5" }
patrolli = { path = "." }
patrolli-cluster = { path = "crates/cluster" }
patrolli-processor = { path = "crates/processor" }
patrolli-proto = { path = "crates/proto" }
patrolli-sink = { path = "crates/sink" }
petgraph = "0.8.3"
prost = "0.14.4"
rand = "0.10.3"
rdkafka = { version = "^0.39.0", features = [
    "gssapi",
    "cmake-build",
    "ssl",
    "zstd",
] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustc-hash = "2.1.3"
rustls = "0.23.46"
sea-query = { version = "1.0.2", features = ["thread-safe"] }
sea-query-postgres = { version = "0.6.1", features = [
    "with-uuid",
    "with-chrono",
    "with-json",
    "postgres-array",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = [
    "arbitrary_precision",
    "raw_value",
] }
serde_yaml_ng = "0.10.0"
smallvec = { version = "1.15.1", features = ["write"] }
smol_str = { version = "0.3.7", features = ["serde"] }
strum = "0.28.0"
strum_macros = "0.28.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-time-0_3",
] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["codec", "time"] }
tonic = { version = "0.14.9", features = ["tls-aws-lc"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.29.0", features = ["serde", "v5", "v7"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = "0.14.3"

