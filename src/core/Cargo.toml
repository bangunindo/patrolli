# TCP_MD5SIG for passive BGP session passwords.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile.workspace = true
# An in-process agent for the snmp monitor tests.
async-snmp = { version = "0.18.1", features = ["agent"] }
# An independent BGP encoder for the BMP decoder's differential test.
netgauze-bgp-pkt = "0.13"
netgauze-parse-utils = "0.13"

[lints]
workspace = true

[profile.dev]
# Full debuginfo (debug = 2) bloats the binary and dominates link time on a
# 700+ dep build. line-tables-only keeps file:line in panics/backtraces.
debug = "line-tables-only"
split-debuginfo = "unpacked"
lto = "off"

[profile.dev.package."*"]
# Dependencies almost never need debuginfo during local iteration.
debug = false

[profile.release]
# Unwind (the default), not abort: a panic is fatal either way, but unwinding
# lets the panic hook log it and run the orderly shutdown (see
# `common::panic`).

[profile.profile]
inherits = "release"
debug = true
strip = false

