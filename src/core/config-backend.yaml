global:
  logger:
    level: info
    print_trace: true
    modules:
      - name: async_snmp
        level: "off"
      - name: tower
        level: debug
  disk_channel:
    data_dir: ./data
  backend:
    cluster:
      node_id: 019d8eec-203e-7e83-895e-6a07d6f2f58e
      node_name: local-test-node
      metadata:
        advertise_address: 127.0.0.1:9001
    db_url: "postgresql://patrolli:patrolli@127.0.0.1:5432/patrolli"
    api:
      addr: 0.0.0.0:8080
      auth:
        local:
          jwt_issuer: patrolli-cluster-1
          access_token_ttl: 900
          refresh_token_ttl: 604800
