name: Set up Rust for src/core
description: >-
  Frees runner disk space, installs the native build dependencies of
  src/core/Dockerfile and the pinned Rust toolchain, and restores the cargo
  cache. Only pushes to main save the cache; PRs and tags restore it from main.
inputs:
  toolchain:
    description: Rust toolchain version to install and make the default.
    required: true
  components:
    description: Comma-separated rustup components, e.g. "rustfmt,clippy".
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        # libcurl4-openssl-dev: librdkafka 2.12 includes <curl/curl.h> even
        # without curl (an #ifdef on an always-defined macro); headers only.
        sudo apt-get install -y --no-install-recommends \
          cmake libclang-dev libsasl2-dev libcurl4-openssl-dev protobuf-compiler libunwind-dev
    - name: Install Rust ${{ inputs.toolchain }}
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        args=()
        if [[ -n "$COMPONENTS" ]]; then args+=(--component "$COMPONENTS"); fi
        rustup toolchain install "$TOOLCHAIN" --profile minimal "${args[@]}"
        rustup default "$TOOLCHAIN"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src/core
        save-if: ${{ github.ref == 'refs/heads/main' }}
