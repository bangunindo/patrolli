name: Release

# Pushing a `v<semver>` tag publishes patrolli-core and patrolli-web
# (linux/amd64 and linux/arm64) to Docker Hub and GHCR. Nothing is built or
# tested here: the tagged commit must be on main and have a successful CI run
# (ci.yaml) from its push to main, which ran the tests and the web e2e and
# published ghcr.io/bangunindo/patrolli-<image>:tree-<git tree hash of
# src/<image>>. Those exact images are promoted to the version tags. Tag after
# that run goes green; if it is still running, re-run this workflow once it
# finishes.
# The version tags point at a new index over the same per-arch images (with
# their BuildKit provenance and SBOM), carrying the version as an index
# annotation, plus a signed GitHub build provenance attestation.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Derive version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<semver>"
            exit 1
          fi
          # The binary reports CARGO_PKG_VERSION (OpenAPI info, and the cluster
          # hello handshake once re-enabled), so the image tag must match it.
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src/core/Cargo.toml | head -n1)"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "::error::tag version $version does not match src/core/Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require a green CI run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # base...head: main is "ahead" of (or "identical" to) a commit it contains.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)"
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main (compare status: $status)"
            exit 1
          fi
          # CI only runs for the head commit of each push, so tag a commit that
          # main pointed at, e.g. a PR merge commit.
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
            --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"')"
          echo "${runs:-no CI runs}"
          if grep -q '^completed success ' <<< "$runs"; then
            exit 0
          fi
          if [[ -z "$runs" ]]; then
            echo "::error::$GITHUB_SHA has no CI run from a push to main; tag a commit main pointed at after a push"
          elif grep -qv '^completed ' <<< "$runs"; then
            echo "::error::CI for $GITHUB_SHA on main is still running; re-run this workflow once it succeeds"
          else
            echo "::error::CI for $GITHUB_SHA on main did not succeed; fix main and tag a new commit"
          fi
          exit 1

  promote:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image: [core, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DOCKERHUB_IMAGE: docker.io/bangunindo/patrolli-${{ matrix.image }}
      GHCR_IMAGE: ghcr.io/bangunindo/patrolli-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: source
        name: Resolve and verify the image CI published from main
        env:
          IMAGE: ${{ matrix.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pinned by digest, so the version tags get exactly what was verified.
          ref="$GHCR_IMAGE:tree-$(git rev-parse "HEAD:src/$IMAGE")"
          if ! manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}')"; then
            echo "::error::$ref is not published; CI on main should have pushed it"
            exit 1
          fi
          source="$GHCR_IMAGE@$(jq -r .digest <<< "$manifest")"
          if ! jq -e '[.manifests[]?.platform | "\(.os)/\(.architecture)"] | index("linux/amd64") and index("linux/arm64")' \
            <<< "$manifest" >/dev/null; then
            echo "::error::$ref is not an amd64+arm64 image; re-run CI on main to rebuild it"
            exit 1
          fi
          # Anyone who can push a branch can push to GHCR; only ship what
          # ci.yaml on main built and attested.
          if ! gh attestation verify "oci://$source" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yaml" \
            --source-ref refs/heads/main --deny-self-hosted-runners; then
            echo "::error::$source has no attestation from ci.yaml on main; refusing to release it"
            exit 1
          fi
          docker buildx imagetools inspect "$source"
          echo "ref=$source" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # latest=auto: `latest` and X.Y are skipped for prerelease tags.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          annotations: |
            org.opencontainers.image.title=patrolli-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Tag the image
        # Copies the per-arch images and their attestations to Docker Hub.
        env:
          SOURCE: ${{ steps.source.outputs.ref }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${args[@]}" "$SOURCE"
      - id: inspect
        name: Inspect manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/bangunindo/patrolli-${{ matrix.image }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
