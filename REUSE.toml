version = 1
SPDX-PackageName = "Patrolli"
SPDX-PackageSupplier = "PT Bangunindo Teknusa Jaya"
SPDX-PackageDownloadLocation = "https://github.com/bangunindo/patrolli"

# Source files carry their own SPDX header. This file covers what can't, or
# shouldn't: files without comment syntax, Markdown with frontmatter, data,
# images, lockfiles, and files whose bytes must stay as they are.

[[annotations]]
path = [
    "**/*.md",
    "**/*.json",
    "**/*.lock",
    "**/*.png",
    "**/*.svg",
    "**/*.webp",
    "**/*.ico",
    "**/*.bin",
    "**/*.dump",
    "**/corpus.txt",
    "**/requirements.txt",
    # refinery checksums applied migrations, so their content must not change.
    "src/core/migrations/**",
]
SPDX-FileCopyrightText = "2024-2026 PT Bangunindo Teknusa Jaya"
SPDX-License-Identifier = "AGPL-3.0-only"

# Generated by orval from src/core/openapi.json; a header would be lost on
# the next regeneration.
[[annotations]]
path = "src/web/shared/generated/**"
precedence = "override"
SPDX-FileCopyrightText = "2024-2026 PT Bangunindo Teknusa Jaya"
SPDX-License-Identifier = "AGPL-3.0-only"

# Components copied from shadcn-vue (https://www.shadcn-vue.com), itself a
# port of shadcn/ui. Local changes stay under the upstream MIT license.
[[annotations]]
path = "src/web/app/components/ui/**"
precedence = "override"
SPDX-FileCopyrightText = [
    "2023 shadcn",
    "2023 unovue",
    "2024-2026 PT Bangunindo Teknusa Jaya",
]
SPDX-License-Identifier = "MIT"

# Test fixtures: MIB modules from IETF RFCs 3418 and 2863, and the IANA-maintained
# IANAifType-MIB.
[[annotations]]
path = "src/core/tests/mibs/**"
precedence = "override"
SPDX-FileCopyrightText = "The Internet Society"
SPDX-License-Identifier = "LicenseRef-ISOC-RFC"
